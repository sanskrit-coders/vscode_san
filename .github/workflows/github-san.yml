name: Github-san tools (VS Code)

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  release:
    types: [ published ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: github-san
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-san/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: github-san-vsix
          path: github-san/build/*.vsix

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        working-directory: github-san
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: github-san/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Attach VSIX to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/*.vsix --clobber
      - name: Publish to VS Marketplace (when configured)
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSCE_OIDC: ${{ vars.VSCE_TRUSTED_PUBLISHING }}
        run: |
          VSIX=$(ls build/*.vsix | head -n1)
          if [ "$VSCE_OIDC" = "true" ]; then
            npx --yes @vscode/vsce publish --packagePath "$VSIX" --oidc
          elif [ -n "$VSCE_PAT" ]; then
            npx --yes @vscode/vsce publish --packagePath "$VSIX" -p "$VSCE_PAT"
          else
            echo "Neither VSCE_TRUSTED_PUBLISHING nor VSCE_PAT is set; skipping VS Marketplace upload."
          fi
      - name: Publish to Open VSX (when configured)
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -n "$OVSX_PAT" ]; then
            npx --yes ovsx publish build/*.vsix -p "$OVSX_PAT"
          else
            echo "OVSX_PAT secret not set; skipping Open VSX upload."
          fi
